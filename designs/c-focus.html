<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案 C · 专注单段</title>
<style>
/* ============================================================
   方案 C —「专注」Focus Mode
   核心：一次只给一段。没有侧栏、没有工具条、没有滚动条，只有这一段和进度。
   适合「读不进去」的时候 —— 减少的是选择，不是信息。
   ============================================================ */
:root{
  --bg:#f8f5ee;
  --ink:#1f1c17;
  --ink-2:#4a4438;
  --ink-3:#948a78;
  --accent:#b5401f;
  --line:#e3dccd;
  --serif:"Iowan Old Style",Charter,"Sitka Text",Georgia,"Songti SC",serif;
  --sans:"Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--serif);
  display:flex; flex-direction:column; overflow:hidden;
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(ellipse at 50% 0%, rgba(181,64,31,.05), transparent 60%);
}
.badge{
  position:fixed; right:20px; top:66px; z-index:60;
  font-family:var(--sans); font-size:10px; letter-spacing:1.4px; text-transform:uppercase;
  background:var(--ink); color:var(--bg); padding:6px 10px; border-radius:99px; opacity:.5;
}

/* ---------- 顶栏 ---------- */
.top{
  position:relative; z-index:2; display:flex; align-items:center; gap:16px;
  padding:18px 30px; font-family:var(--sans); font-size:11.5px; color:var(--ink-3);
  letter-spacing:.6px;
}
.top .t{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.top .t b{color:var(--ink); font-weight:600; letter-spacing:0}
.top .k{font-size:10px; letter-spacing:2.6px; text-transform:uppercase; color:var(--accent); font-weight:700}

/* ---------- 舞台 ---------- */
.stage{
  position:relative; z-index:1; flex:1; display:flex; align-items:center; justify-content:center;
  padding:0 40px; min-height:0;
}
.page{width:min(37rem,100%); max-height:100%; overflow:auto; padding:8px 0 20px; scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.page.swap{animation:swap .34s cubic-bezier(.2,.7,.2,1)}
@keyframes swap{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}

.hero{text-align:center; margin-bottom:46px}
.hero .kick{font-family:var(--sans); font-size:10px; letter-spacing:3.4px; text-transform:uppercase; color:var(--accent); font-weight:700}
.hero h1{font-size:clamp(28px,4vw,42px); line-height:1.16; font-weight:600; letter-spacing:-.015em; margin:14px 0 0; text-wrap:balance}
.hero .m{font-family:var(--sans); font-size:11px; letter-spacing:1.6px; text-transform:uppercase; color:var(--ink-3); margin-top:16px}

.txt{font-size:21px; line-height:1.95; letter-spacing:.002em; color:var(--ink)}
.txt p{margin:0}
.para-no{
  display:block; font-family:var(--sans); font-size:11px; color:var(--ink-3);
  letter-spacing:2px; margin-bottom:14px;
}

/* 译文 */
.tr-wrap{max-height:0; overflow:hidden; transition:max-height .3s ease, opacity .3s ease; opacity:0}
.tr-wrap.on{max-height:600px; opacity:1}
.tr{
  margin-top:26px; padding-top:20px; border-top:1px solid var(--line);
  font-family:var(--sans); font-size:14.5px; line-height:2.05; color:var(--ink-2); letter-spacing:.012em;
}

/* 词 */
.w{font-weight:inherit; border-bottom:1px dotted rgba(181,64,31,.55); cursor:pointer; transition:background .12s}
.w:hover,.w.hot{background:#f2e2d6; border-bottom-style:solid}

/* ---------- 底栏 ---------- */
.bottom{
  position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:14px 30px 26px; font-family:var(--sans);
}
.nav{display:flex; align-items:center; gap:8px}
.nav button{
  width:38px; height:38px; display:grid; place-items:center; border-radius:50%;
  border:1px solid var(--line); background:transparent; color:var(--ink-2); cursor:pointer;
  transition:all .15s;
}
.nav button:hover:not(:disabled){border-color:var(--ink-2); color:var(--ink); transform:translateY(-1px)}
.nav button:disabled{opacity:.3; cursor:default}
.nav svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.mid{display:flex; align-items:center; gap:14px}
.tr-toggle{
  font-size:12.5px; padding:7px 15px; border-radius:99px; border:1px solid var(--line);
  background:transparent; color:var(--ink-2); cursor:pointer; letter-spacing:.4px;
}
.tr-toggle.on{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.count{font-size:12px; color:var(--ink-3); letter-spacing:1px; font-variant-numeric:tabular-nums}
.kbd{font-size:11px; color:var(--ink-3); letter-spacing:.5px}
.kbd kbd{
  font-family:var(--sans); font-size:10px; border:1px solid var(--line); border-bottom-width:2px;
  border-radius:4px; padding:1px 4px; background:#fffdf8; color:var(--ink-2);
}

/* ---------- 右侧刻度 ---------- */
.rail{
  position:fixed; right:26px; top:50%; transform:translateY(-50%); z-index:3;
  display:flex; flex-direction:column; gap:9px;
}
.rail button{
  width:2px; height:16px; border:0; padding:0; background:var(--line); cursor:pointer; border-radius:2px;
  transition:all .2s;
}
.rail button.on{background:var(--accent); height:26px}
.rail button:hover{background:var(--ink-3)}

/* ---------- 词卡 ---------- */
.card{
  position:fixed; z-index:80; width:300px; max-width:calc(100vw - 24px);
  background:#fffdf7; border:1px solid var(--line); border-radius:11px;
  box-shadow:0 2px 5px rgba(31,28,23,.07), 0 22px 46px -18px rgba(31,28,23,.36);
  padding:14px 15px 12px; display:none;
}
.card.show{display:block; animation:pop .15s ease}
@keyframes pop{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
.card .wd{font-size:19px; font-weight:600}
.card .ph{font-size:12px; color:var(--ink-3); margin-left:7px}
.card .tags{display:flex; gap:5px; margin-top:6px}
.card .tag{font-family:var(--sans); font-size:9.5px; padding:1px 6px; border-radius:99px; background:#efe9db; color:var(--ink-2)}
.card .mn{font-family:var(--sans); font-size:13.5px; line-height:1.65; margin-top:7px}

@media (max-width:720px){
  .top{padding:12px 18px}
  .stage{padding:0 22px}
  .txt{font-size:18.5px; line-height:1.9}
  .bottom{padding:10px 18px 20px; flex-wrap:wrap; gap:10px}
  .kbd{display:none}
  .rail{display:none}
  .hero{margin-bottom:30px}
}
</style>
</head>
<body>
<div class="badge">方案 C · 专注</div>
<div class="card" id="card"></div>

<header class="top">
  <span class="k">Close Reading</span>
  <span class="t"><b>The Quiet Rebellion of Doing Nothing</b> · 原创示例</span>
  <span class="count" id="cnt">1 / 8</span>
</header>

<main class="stage">
  <div class="page" id="page"></div>
</main>

<footer class="bottom">
  <div class="nav">
    <button id="prev" title="上一段（←）"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
    <button id="next" title="下一段（→）"><svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg></button>
  </div>
  <div class="mid">
    <button class="tr-toggle" id="trBtn">显示译文 · T</button>
  </div>
  <div class="kbd"><kbd>←</kbd> <kbd>→</kbd> 切换段落 · <kbd>T</kbd> 译文</div>
</footer>

<aside class="rail" id="rail"></aside>

<script>
const ARTICLE = {
  paras: [
    {en:"Not long ago, waiting was an unavoidable part of ordinary life. We waited in lines, waited for buses, waited for friends who were late. These small interludes were treated as dead time — moments to be endured rather than savored. The smartphone has quietly abolished them. Every idle second can now be filled with a scroll, a swipe, a video, and most of us fill it without ever deciding to.",
     zh:"不久以前，等待还是日常生活里绕不开的一部分。我们排队、等公交、等迟到的朋友。这些短暂的间歇曾被当作「死时间」——是拿来忍受、而非品味的时刻。而智能手机悄无声息地废除了它们。如今每一秒空闲都能被一次滑动、一次刷屏、一段视频填满，而且我们大多数人根本未经决定，就把它们填满了。"},
    {en:"We are told that this is progress, that an unoccupied mind is a wasted one. But a growing body of research suggests the opposite: the idle brain does some of its most important work precisely when nothing is happening. When we are bored, the mind drifts, and in that drifting it consolidates memories, rehearses possible futures, and stumbles onto ideas that a packed schedule would never permit. Psychologists call this the default mode network; poets simply call it daydreaming.",
     zh:"有人告诉我们这是进步，说闲着的大脑就是浪费的大脑。但越来越多的研究指向相反的结论：恰恰在无事发生的时候，无所事事的大脑在做一些最重要的工作。当我们感到无聊，思绪开始游荡，而在这游荡之中，大脑巩固记忆、预演种种可能的未来，还会偶然撞上排得满满的日程永远不会允许的念头。心理学家称之为「默认模式网络」；诗人则干脆称之为白日梦。"},
    {en:"The cost of constant stimulation is easy to describe and hard to measure. Attention, like a muscle, can atrophy. Each fleeting hit of novelty delivers a small dose of gratification, and the threshold for what counts as interesting creeps steadily upward. Tasks that reward patience — reading a novel, learning an instrument, writing anything honest — begin to feel not merely difficult but vaguely humiliating, because they demand exactly the sustained focus we are losing practice at.",
     zh:"持续刺激的代价，说起来容易，衡量起来很难。注意力像肌肉一样，是会萎缩的。每一次转瞬即逝的新鲜感都送来一小剂满足，而「什么才算有趣」的门槛则不知不觉地稳步上移。那些奖赏耐心的活动——读一部长篇、学一门乐器、写点诚实的东西——开始让人觉得不只是困难，简直隐隐有些丢脸，因为它们要求的，恰恰是我们正日渐生疏的持续专注。"},
    {en:"None of this is an argument for smashing your phone. The device is not the villain; the habit is. The question is whether we can carve out spaces in the day that remain deliberately unfilled — not optimized, not gamified, simply empty. Boredom, it turns out, is not the absence of meaning but a kind of appetite for it. Monotony is the soil in which imagination, given nothing else to eat, finally begins to grow.",
     zh:"这一切并不是要你砸掉手机。设备不是罪魁祸首，习惯才是。问题在于：我们能否在一天中开辟出一些刻意留白的空间——不去优化、不做游戏化，只是空着。事实证明，无聊并非意义的缺席，而是对意义的一种胃口。单调是想象力的土壤：当别无可食之时，想象力终于开始生长。"},
    {en:"The Victorians understood this instinctively. They defended the Sunday walk, the solitary hobby, the long handwritten letter — not as escapes from productive life but as its quiet foundation. Solitude, they suspected, was where a self was slowly assembled; being alone with one’s own thoughts now looks, from the far side of the feed, almost heroic.",
     zh:"维多利亚时代的人凭直觉明白这一点。他们守护周日的散步、独自的爱好、手写的长信——这些不是对有效率生活的逃避，而是它安静的根基。他们猜想，独处正是一个自我被慢慢塑造的地方；如今在信息流的另一端回望，与自己独处这件事，几乎称得上英勇。"},
    {en:"To reclaim that territory we do not need a cabin in the woods, only a small ritual: the walk without headphones, the commute with the phone in the bag, the first ten minutes of the morning left unclaimed by any screen. The mind will protest. It has been trained to expect a reward every few seconds, and it will ask, loudly, whether this stillness is not a waste. That question is the starting line.",
     zh:"要收回那片领地，我们并不需要林间小屋，只需要一个小小的仪式：不戴耳机的散步、把手机放进包里的通勤、清晨头十分钟不交给任何屏幕。念头会抗议。它已被训练成每隔几秒就期待一次奖赏，它会大声追问：这么静着，难道不是浪费吗？而那个问题，正是起跑线。"},
    {en:"What lies beyond the protest is not bliss but something better: capability. Attention that has been allowed to wander comes back wider. Reading, once the mind has settled, stops being a confrontation and becomes a conversation. The page is patient in a way that almost nothing else in modern life is, and that patience — so conspicuously absent from our feeds — turns out to be exactly what deep learning requires.",
     zh:"抗议声过后等着的并非极乐，而是更好的东西：能力。被允许游荡过的注意力，回来时会更开阔。一旦心定了下来，阅读不再是一场对抗，而成为一场对话。书页以一种现代生活中几乎绝无仅有的方式耐心，而那种在我们的信息流里显眼缺席的耐心，恰恰是深度学习最需要的东西。"},
    {en:"So waste a little time this week, on purpose. Sit in the park with nothing. Let the boredom rise and do not answer it. The ideas that arrive uninvited, in the silence we keep fleeing, are usually the ones worth keeping. Doing nothing, it turns out, is how we finally do something.",
     zh:"所以，这周不妨故意浪费一点时间。坐在公园里，什么都不带。让无聊升起来，别去回应它。那些在我们一直逃离的寂静里不请自来的念头，往往才是值得留下的。无所作为，到头来恰恰是我们真正有所作为的方式。"}
  ]
};

const WORDS = [
  {w:'interlude', f:['interludes'], pos:'n.', ph:'/ˈɪntərluːd/', zh:'间歇；幕间；插曲', p:0, lv:'考研'},
  {w:'savor', f:['savored'], pos:'v.', ph:'/ˈseɪvər/', zh:'品味；细细体会', p:0, lv:'托福'},
  {w:'abolish', f:['abolished'], pos:'v.', ph:'/əˈbɑːlɪʃ/', zh:'废除（制度、习俗）', p:0, lv:'CET-6'},
  {w:'idle', f:['idle'], pos:'adj.', ph:'/ˈaɪdl/', zh:'空闲的；无所事事的', p:0, lv:'CET-6'},
  {w:'consolidate', f:['consolidates'], pos:'v.', ph:'/kənˈsɑːlɪdeɪt/', zh:'巩固；合并', p:1, lv:'考研'},
  {w:'rehearse', f:['rehearses'], pos:'v.', ph:'/rɪˈhɜːrs/', zh:'排练；（心里）预演', p:1, lv:'专八'},
  {w:'stumble on', f:['stumbles onto'], pos:'phr.', ph:'', zh:'偶然发现；无意中碰上', p:1, lv:'考研'},
  {w:'atrophy', f:['atrophy'], pos:'v.', ph:'/ˈætrəfi/', zh:'萎缩，衰退', p:2, lv:'GRE'},
  {w:'fleeting', f:['fleeting'], pos:'adj.', ph:'/ˈfliːtɪŋ/', zh:'转瞬即逝的', p:2, lv:'雅思'},
  {w:'novelty', f:['novelty'], pos:'n.', ph:'/ˈnɑːvlti/', zh:'新奇（感）', p:2, lv:'CET-6'},
  {w:'gratification', f:['gratification'], pos:'n.', ph:'/ˌɡrætɪfɪˈkeɪʃn/', zh:'满足感', p:2, lv:'考研'},
  {w:'threshold', f:['threshold'], pos:'n.', ph:'/ˈθreʃhoʊld/', zh:'门槛；阈限', p:2, lv:'CET-6'},
  {w:'humiliating', f:['humiliating'], pos:'adj.', ph:'/hjuːˈmɪlieɪtɪŋ/', zh:'使人蒙羞的', p:2, lv:'专八'},
  {w:'sustained', f:['sustained'], pos:'adj.', ph:'/səˈsteɪnd/', zh:'持续的', p:2, lv:'CET-6'},
  {w:'villain', f:['villain'], pos:'n.', ph:'/ˈvɪlən/', zh:'反派；罪魁祸首', p:3, lv:'考研'},
  {w:'carve out', f:['carve out'], pos:'phr.', ph:'', zh:'开辟出；争取到', p:3, lv:'考研'},
  {w:'deliberate', f:['deliberately'], pos:'adj.', ph:'/dɪˈlɪbərət/', zh:'故意的；深思熟虑的', p:3, lv:'CET-6'},
  {w:'monotony', f:['monotony'], pos:'n.', ph:'/məˈnɑːtəni/', zh:'单调，千篇一律', p:3, lv:'CET-6'},
  {w:'gamify', f:['gamified'], pos:'v.', ph:'/ˈɡeɪmɪfaɪ/', zh:'使游戏化', p:3, lv:'超纲'},
  {w:'instinctively', f:['instinctively'], pos:'adv.', ph:'/ɪnˈstɪŋktɪvli/', zh:'本能地', p:4, lv:'CET-6'},
  {w:'solitary', f:['solitary'], pos:'adj.', ph:'/ˈsɑːləteri/', zh:'独自的；喜独处的', p:4, lv:'CET-6'},
  {w:'solitude', f:['solitude'], pos:'n.', ph:'/ˈsɑːlətuːd/', zh:'独处；孤独', p:4, lv:'专八'},
  {w:'reclaim', f:['reclaim'], pos:'v.', ph:'/rɪˈkleɪm/', zh:'收回；重新获得', p:5, lv:'托福'},
  {w:'bliss', f:['bliss'], pos:'n.', ph:'/blɪs/', zh:'极乐，至福', p:6, lv:'专八'},
  {w:'confrontation', f:['confrontation'], pos:'n.', ph:'/ˌkɑːnfrənˈteɪʃn/', zh:'对抗，对峙', p:6, lv:'考研'},
  {w:'conspicuous', f:['conspicuously'], pos:'adj.', ph:'/kənˈspɪkjuəs/', zh:'显眼的，惹人注目的', p:6, lv:'托福'}
];

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rx = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function renderEN(text, pi){
  const list = WORDS.filter(x => x.p === pi);
  const holds = [];
  let t = esc(text);
  const mark = (needle, key) => {
    if (!needle) return;
    const re = new RegExp('\\b' + rx(esc(needle)) + '\\b', 'gi');
    t = t.replace(re, m => {
      holds.push('<b class="w" data-k="' + esc(key) + '">' + m + '</b>');
      return '\u0002' + (holds.length - 1) + '\u0003';
    });
  };
  list.filter(x => x.w.includes(' ')).forEach(x => { mark(x.w, x.w); (x.f || []).forEach(f => mark(f, x.w)); });
  list.filter(x => !x.w.includes(' ')).forEach(x => { mark(x.w, x.w); (x.f || []).forEach(f => mark(f, x.w)); });
  return t.replace(/\u0002(\d+)\u0003/g, (_, i) => holds[+i]);
}

const page = document.getElementById('page');
const rail = document.getElementById('rail');
const cnt = document.getElementById('cnt');
const trBtn = document.getElementById('trBtn');
let idx = 0, showTr = false, firstPaint = true;

rail.innerHTML = ARTICLE.paras.map((_, i) => `<button data-i="${i}" title="第 ${i + 1} 段"></button>`).join('');

function render(){
  const p = ARTICLE.paras[idx];
  page.innerHTML = `
    ${idx === 0 ? `<div class="hero">
      <div class="kick">Press Reader · Essay</div>
      <h1>The Quiet Rebellion of Doing Nothing</h1>
      <div class="m">2026 年 9 月号 · 540 词 · 26 个生词</div>
    </div>` : ''}
    <div class="txt">
      <span class="para-no">${String(idx + 1).padStart(2, '0')} — ${['等待的消失','无所事事的大脑','注意力的萎缩','留白的空间','独处的价值','小小的仪式','对抗之后的','故意的浪费'][idx]}</span>
      <p>${renderEN(p.en, idx)}</p>
      <div class="tr-wrap${showTr ? ' on' : ''}"><div class="tr">${esc(p.zh)}</div></div>
    </div>`;
  page.classList.remove('swap');
  if (!firstPaint) { void page.offsetWidth; page.classList.add('swap'); }
  firstPaint = false;
  page.scrollTop = 0;
  cnt.textContent = (idx + 1) + ' / ' + ARTICLE.paras.length;
  document.querySelectorAll('.rail button').forEach((b, i) => b.classList.toggle('on', i === idx));
  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').disabled = idx === ARTICLE.paras.length - 1;
  trBtn.classList.toggle('on', showTr);
  trBtn.textContent = showTr ? '收起译文 · T' : '显示译文 · T';
}

document.getElementById('prev').onclick = () => { if (idx > 0) { idx--; render(); } };
document.getElementById('next').onclick = () => { if (idx < ARTICLE.paras.length - 1) { idx++; render(); } };
rail.querySelectorAll('button').forEach(b => b.onclick = () => { idx = +b.dataset.i; render(); });
trBtn.onclick = () => { showTr = !showTr; render(); };

addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); document.getElementById('next').click(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); document.getElementById('prev').click(); }
  else if (e.key === 't' || e.key === 'T') { trBtn.click(); }
});

/* 词卡 */
const card = document.getElementById('card');
function showCard(el){
  const w = WORDS.find(x => x.w === el.dataset.k);
  if (!w) return;
  card.innerHTML = `<div class="wd">${esc(w.w)}</div>
    <span class="ph">${esc(w.ph || '')}</span>
    <div class="tags"><span class="tag">${esc(w.lv)}</span><span class="tag">${esc(w.pos)}</span></div>
    <div class="mn">${esc(w.zh)}</div>`;
  card.classList.add('show');
  const r = el.getBoundingClientRect();
  const cw = card.offsetWidth, ch = card.offsetHeight;
  let left = Math.max(12, Math.min(innerWidth - cw - 12, r.left + r.width / 2 - cw / 2));
  let top = r.bottom + 10;
  if (r.bottom + ch + 24 > innerHeight) top = Math.max(12, r.top - ch - 10);
  card.style.left = left + 'px';
  card.style.top = top + 'px';
  document.querySelectorAll('.w.hot').forEach(n => n.classList.remove('hot'));
  el.classList.add('hot');
}
document.addEventListener('click', e => {
  const w = e.target.closest('.w');
  if (w) { e.stopPropagation(); showCard(w); return; }
  card.classList.remove('show');
  document.querySelectorAll('.w.hot').forEach(n => n.classList.remove('hot'));
});

render();
</script>
</body>
</html>
