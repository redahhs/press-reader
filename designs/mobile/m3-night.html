<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>方案 3 · 大字夜读</title>
<style>
/* ============================================================
   方案 3 —「大字夜读」
   手机阅读最常见的场景其实是躺着、只看得清大一号的字。
   字放大到 20px / 行高 1.95，底部三个大按钮全部落在拇指区（≥52px）。
   查词不从底部弹面板（会盖住下半屏），而是就地在该段下方展开一张小卡，
   上下文不动，看完继续读。
   ============================================================ */
:root{
  --bg:#15120f; --bg-2:#1c1814; --card:#221d17; --ink:#ece4d5; --ink-2:#b3a894;
  --ink-3:#8b8170; --line:#302a22; --line-2:#3d362b; --accent:#e0a45c; --accent-soft:#3a2a18;
  --serif:"Iowan Old Style",Charter,"Sitka Text",Georgia,"Songti SC",serif;
  --sans:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei UI",sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%}
body{background:#111013; display:grid; place-items:center; padding:28px 16px; font-family:var(--sans); color:#fff}
.stage{display:flex; flex-direction:column; align-items:center; gap:14px}
.cap{font-size:12px; letter-spacing:1.6px; color:#8b8794; text-transform:uppercase}
.cap b{color:#fff; font-weight:600; letter-spacing:0; text-transform:none; font-size:13px}

.phone{width:390px; height:844px; border-radius:46px; padding:9px;
  background:linear-gradient(160deg,#3a3a42,#141418 60%);
  box-shadow:0 30px 80px -20px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.06) inset; position:relative}
.screen{position:relative; width:100%; height:100%; border-radius:38px; overflow:hidden;
  background:var(--bg); color:var(--ink); display:flex; flex-direction:column}
.island{position:absolute; top:9px; left:50%; transform:translateX(-50%); width:104px; height:26px; border-radius:14px; background:#07070a; z-index:30}
.statusbar{height:46px; flex:none; display:flex; align-items:flex-end; justify-content:space-between;
  padding:0 22px 4px; font-size:12.5px; font-weight:600; color:var(--ink); z-index:20}
.statusbar .icons{display:flex; gap:5px; align-items:center; opacity:.8}
.statusbar svg{width:15px; height:15px}

/* 顶栏：只留一行，滚动时可隐去 */
.topbar{flex:none; display:flex; align-items:center; gap:10px; padding:4px 20px 10px}
.topbar .back{width:40px; height:40px; display:grid; place-items:center; border-radius:12px; color:var(--ink-2); border:0; background:transparent}
.topbar .t{flex:1; min-width:0; font-size:12.5px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.topbar .t b{display:block; color:var(--ink); font-size:13.5px; font-weight:600; margin-bottom:1px}
.topbar svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

/* 正文 */
.read{flex:1; overflow-y:auto; padding:2px 24px 132px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.read::-webkit-scrollbar{display:none}
.para{margin:0 0 30px; scroll-margin-top:20px}
.pno{display:inline-flex; align-items:baseline; gap:6px; font-family:var(--sans); font-size:10.5px;
  letter-spacing:1.6px; color:var(--ink-3); margin-bottom:9px}
.pno i{font-style:normal; width:5px; height:5px; border-radius:50%; background:var(--line-2); display:inline-block}
.en{font-family:var(--serif); font-size:20px; line-height:1.95; color:var(--ink); letter-spacing:.002em}
.w{border-bottom:1px solid rgba(224,164,92,.45); cursor:pointer; transition:background .12s}
.w.on{background:var(--accent-soft); color:var(--accent); border-bottom-color:var(--accent)}
.zh{display:none; margin-top:14px; font-size:14.5px; line-height:2; color:var(--ink-2)}
body.show-zh .zh{display:block}

/* 就地词卡：插在段落下方，不悬浮 */
.def{
  margin-top:14px; padding:14px 16px 12px; background:var(--card);
  border-left:2px solid var(--accent); border-radius:0 12px 12px 0;
  animation:drop .18s ease;
}
@keyframes drop{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:none}}
.def .hd{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.def .hd b{font-family:var(--serif); font-size:19px; font-weight:600}
.def .hd span{font-size:11.5px; color:var(--ink-3)}
.def .mn{font-size:14px; line-height:1.7; margin-top:7px; color:var(--ink)}
.def .ex{font-family:var(--serif); font-size:13px; line-height:1.7; color:var(--ink-3); margin-top:8px}
.def .acts{display:flex; gap:8px; margin-top:12px}
.def .acts button{height:44px; flex:1; border-radius:10px; font-size:13px; cursor:pointer}
.b1{border:1px solid var(--line-2); background:transparent; color:var(--ink-2)}
.b2{border:0; background:var(--accent); color:#1a1510; font-weight:600}
.def .x{position:absolute; right:0; top:0}

/* 底部坞：拇指区三个大键 */
.dock{position:absolute; left:0; right:0; bottom:0; z-index:25;
  padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(rgba(21,18,15,0), #15120f 22%);
}
.pbar{height:2px; background:var(--line); border-radius:2px; margin-bottom:12px; overflow:hidden}
.pbar i{display:block; height:100%; width:0; background:var(--accent); transition:width .1s linear}
.dock-row{display:flex; gap:10px}
.dock-row button{
  height:56px; border-radius:16px; border:1px solid var(--line-2); background:var(--bg-2);
  color:var(--ink-2); display:grid; place-items:center; cursor:pointer; font-size:13.5px; font-family:var(--sans);
}
.dock-row button:active{transform:scale(.97)}
.dock-row .nav{width:64px; flex:none}
.dock-row .nav svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.dock-row .zh{flex:1; letter-spacing:.5px}
.dock-row .zh.on{background:var(--accent); border-color:var(--accent); color:#1a1510; font-weight:600}

@media (max-width:700px){
  body{padding:0; display:block; background:var(--bg)}
  .stage{gap:0}
  .cap{display:none}
  .phone{width:100%; height:100dvh; border-radius:0; padding:0; background:var(--bg); box-shadow:none}
  .screen{border-radius:0; height:100dvh}
  .island{display:none}
  .statusbar{height:env(safe-area-inset-top,24px); min-height:24px}
}
</style>
</head>
<body>
<div class="stage">
  <figure class="phone" style="margin:0">
    <div class="screen">
      <div class="island"></div>
      <div class="statusbar">
        <span>9:41</span>
        <span class="icons">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9.5a12 12 0 0 1 16 0M7 13a8 8 0 0 1 10 0M10 16.5a4 4 0 0 1 4 0"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="7" width="17" height="10" rx="2.5"/><rect x="4" y="9" width="11" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
        </span>
      </div>
      <div class="topbar">
        <button class="back"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
        <div class="t"><b>The Quiet Rebellion of Doing Nothing</b>第 <span id="cur">1</span> / 4 段</div>
        <button class="back"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.5" fill="currentColor" stroke="none"/></svg></button>
      </div>
      <div class="read" id="read"></div>
      <div class="dock">
        <div class="pbar"><i id="bar"></i></div>
        <div class="dock-row">
          <button class="nav" id="prev"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
          <button class="zh" id="zhBtn">译文</button>
          <button class="nav" id="next"><svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg></button>
        </div>
      </div>
    </div>
  </figure>
  <figcaption class="cap"><b>方案 3 · 大字夜读</b> · 20px 字号 + 拇指坞 + 就地词卡</figcaption>
</div>

<script>
const PARAS = [
  {en:"Not long ago, waiting was an unavoidable part of ordinary life. We waited in lines, waited for buses, waited for friends who were late. These small interludes were treated as dead time — moments to be endured rather than savored.",
   zh:"不久以前，等待还是日常生活里绕不开的一部分。我们排队、等公交、等迟到的朋友。这些短暂的间歇曾被当作「死时间」——是拿来忍受、而非品味的时刻。"},
  {en:"We are told that this is progress, that an unoccupied mind is a wasted one. But a growing body of research suggests the opposite: the idle brain does some of its most important work precisely when nothing is happening.",
   zh:"有人告诉我们这是进步，说闲着的大脑就是浪费的大脑。但越来越多的研究指向相反的结论：恰恰在无事发生的时候，无所事事的大脑在做一些最重要的工作。"},
  {en:"The cost of constant stimulation is easy to describe and hard to measure. Attention, like a muscle, can atrophy. Each fleeting hit of novelty delivers a small dose of gratification.",
   zh:"持续刺激的代价，说起来容易，衡量起来很难。注意力像肌肉一样，是会萎缩的。每一次转瞬即逝的新鲜感都送来一小剂满足。"},
  {en:"None of this is an argument for smashing your phone. The device is not the villain; the habit is. The question is whether we can carve out spaces in the day that remain deliberately unfilled.",
   zh:"这一切并不是要你砸掉手机。设备不是罪魁祸首，习惯才是。问题在于：我们能否在一天中开辟出一些刻意留白的空间。"}
];
const WORDS = {
  interlude:{ph:'/ˈɪntərluːd/', pos:'n.', lv:'考研', zh:'（两件事之间的）间歇；插曲', ex:'These small interludes were treated as dead time.'},
  idle:{ph:'/ˈaɪdl/', pos:'adj.', lv:'CET-6', zh:'空闲的；无所事事的', ex:'the idle brain does its most important work'},
  atrophy:{ph:'/ˈætrəfi/', pos:'v.', lv:'GRE', zh:'（能力、肌肉）萎缩，衰退', ex:'Attention, like a muscle, can atrophy.'},
  fleeting:{ph:'/ˈfliːtɪŋ/', pos:'adj.', lv:'雅思', zh:'转瞬即逝的', ex:'Each fleeting hit of novelty'},
  villain:{ph:'/ˈvɪlən/', pos:'n.', lv:'考研', zh:'反派；罪魁祸首', ex:'The device is not the villain; the habit is.'}
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl = t => {
  let s = esc(t);
  Object.keys(WORDS).forEach(k => { s = s.replace(new RegExp('\\b'+k+'(?:s|es|ed|d|ing)?\\b','gi'), m => `<span class="w" data-k="${k}">${m}</span>`); });
  return s;
};

const read = document.getElementById('read');
read.innerHTML = PARAS.map((p, i) => `
  <section class="para" data-i="${i}">
    <div class="pno"><i></i>${String(i+1).padStart(2,'0')}</div>
    <div class="en">${hl(p.en)}</div>
    <div class="zh">${esc(p.zh)}</div>
  </section>`).join('');

const bar = document.getElementById('bar');
const curEl = document.getElementById('cur');

read.addEventListener('scroll', () => {
  const h = read.scrollHeight - read.clientHeight;
  bar.style.width = (h > 0 ? (read.scrollTop / h) * 100 : 0) + '%';
  const secs = [...read.querySelectorAll('.para')];
  const line = read.scrollTop + 80;
  let idx = 0;
  secs.forEach((s, i) => { if (s.offsetTop <= line) idx = i; });
  curEl.textContent = idx + 1;
}, { passive: true });

const go = d => {
  const secs = [...read.querySelectorAll('.para')];
  const y = read.scrollTop + 80;
  let idx = 0; secs.forEach((s, i) => { if (s.offsetTop <= y) idx = i; });
  const t = secs[Math.max(0, Math.min(secs.length - 1, idx + d))];
  if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
};
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('zhBtn').onclick = e => {
  document.body.classList.toggle('show-zh');
  e.currentTarget.classList.toggle('on', document.body.classList.contains('show-zh'));
};

/* 就地词卡 */
read.addEventListener('click', e => {
  const w = e.target.closest('.w');
  read.querySelectorAll('.def').forEach(n => n.remove());
  read.querySelectorAll('.w.on').forEach(n => n.classList.remove('on'));
  if (!w) return;
  const d = WORDS[w.dataset.k];
  if (!d) return;
  w.classList.add('on');
  const box = document.createElement('div');
  box.className = 'def';
  box.innerHTML = `
    <div class="hd"><b>${esc(w.textContent)}</b><span>${esc(d.ph)} · ${esc(d.pos)} · ${esc(d.lv)}</span></div>
    <div class="mn">${esc(d.zh)}</div>
    <div class="ex">${esc(d.ex)}</div>
    <div class="acts"><button class="b1">朗读</button><button class="b2">加入生词本</button></div>`;
  w.closest('.para').appendChild(box);
  box.querySelector('.b1').onclick = ev => {
    ev.stopPropagation();
    if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(w.textContent); u.lang='en-US'; speechSynthesis.speak(u); }
  };
  box.querySelector('.b2').onclick = ev => {
    ev.stopPropagation();
    box.querySelector('.b2').textContent = '已收录 ✓';
    box.querySelector('.b2').style.opacity = '.75';
  };
});
</script>
</body>
</html>
