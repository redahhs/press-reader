<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>方案 4 · 原生 App</title>
<style>
/* ============================================================
   方案 4 —「原生 App」
   最保守也最好上手的一条：顶栏 + 分段控件 + 卡片流 + 底部四个 Tab。
   牺牲一点沉浸感，换来「永远知道自己在哪、下一步能去哪」。
   适合把精读、生词、复习串成日常习惯，而不是一次性读完一篇文章。
   ============================================================ */
:root{
  --paper:#f6f2ea; --card:#fffdf7; --ink:#242019; --ink-2:#565040; --ink-3:#7d7565;
  --line:#e5dcc8; --line-2:#d3c8ae; --accent:#b5401f; --accent-soft:#f3e2d8;
  --serif:"Iowan Old Style",Charter,"Sitka Text",Georgia,"Songti SC",serif;
  --sans:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei UI",sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%}
body{background:#111013; display:grid; place-items:center; padding:28px 16px; font-family:var(--sans); color:#fff}
.stage{display:flex; flex-direction:column; align-items:center; gap:14px}
.cap{font-size:12px; letter-spacing:1.6px; color:#8b8794; text-transform:uppercase}
.cap b{color:#fff; font-weight:600; letter-spacing:0; text-transform:none; font-size:13px}

.phone{width:390px; height:844px; border-radius:46px; padding:9px;
  background:linear-gradient(160deg,#3a3a42,#141418 60%);
  box-shadow:0 30px 80px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.06) inset; position:relative}
.screen{position:relative; width:100%; height:100%; border-radius:38px; overflow:hidden;
  background:var(--paper); color:var(--ink); display:flex; flex-direction:column}
.island{position:absolute; top:9px; left:50%; transform:translateX(-50%); width:104px; height:26px; border-radius:14px; background:#0b0b0d; z-index:40}
.statusbar{height:46px; flex:none; display:flex; align-items:flex-end; justify-content:space-between;
  padding:0 22px 4px; font-size:12.5px; font-weight:600; z-index:20}
.statusbar .icons{display:flex; gap:5px; align-items:center; opacity:.85}
.statusbar svg{width:15px; height:15px}

/* 顶栏 */
.appbar{flex:none; display:flex; align-items:center; gap:6px; padding:2px 12px 8px}
.appbar button{width:44px; height:44px; border:0; background:transparent; border-radius:12px; display:grid; place-items:center; color:var(--ink-2)}
.appbar button:active{background:var(--line)}
.appbar svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.appbar .ttl{flex:1; min-width:0; text-align:center; font-size:14px; font-weight:600; color:var(--ink);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* 分段控件 */
.segwrap{padding:0 18px 10px}
.seg{display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:3px; background:#eae2d2; border-radius:12px}
.seg button{height:34px; border:0; background:transparent; border-radius:9px; font-family:var(--sans);
  font-size:12.5px; color:var(--ink-3); cursor:pointer; transition:all .16s}
.seg button.on{background:var(--card); color:var(--ink); font-weight:600; box-shadow:0 1px 3px rgba(40,32,20,.12)}
.progress{height:2px; background:transparent; margin:0 18px 8px}
.progress i{display:block; height:100%; width:0; background:var(--accent); border-radius:2px; opacity:.6}

/* 卡片流 */
.feed{flex:1; overflow-y:auto; padding:2px 16px 16px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.feed::-webkit-scrollbar{display:none}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:16px 16px 12px; margin-bottom:12px; position:relative;
}
.card .no{position:absolute; top:16px; left:16px; font-size:10px; letter-spacing:1px; color:var(--ink-3)}
.card .en{margin-top:16px; font-family:var(--serif); font-size:17px; line-height:1.8; color:var(--ink)}
.w{border-bottom:1px solid rgba(181,64,31,.38); cursor:pointer}
.w:active{background:var(--accent-soft)}
.card .zh{display:none; margin-top:12px; padding-top:11px; border-top:1px dashed var(--line-2);
  font-size:13.5px; line-height:1.9; color:var(--ink-2)}
.card.open .zh{display:block}
.card .foot{display:flex; gap:6px; align-items:center; margin-top:12px; flex-wrap:wrap}
.chip{border:1px solid var(--line-2); background:var(--paper); color:var(--ink-3);
  font-family:var(--sans); font-size:11.5px; padding:5px 10px; border-radius:8px; cursor:pointer}
.chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.chip:active{transform:scale(.97)}

/* 底部 Tab */
.tabbar{
  flex:none; display:grid; grid-template-columns:repeat(4,1fr); gap:2px;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  background:rgba(255,253,247,.94); backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
.tabbar a{display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px;
  border-radius:10px; text-decoration:none; color:var(--ink-3); font-size:10px}
.tabbar a .ic{width:22px; height:22px; display:grid; place-items:center}
.tabbar svg{width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.tabbar a.on{color:var(--accent)}
.tabbar a .badge{position:absolute; margin:-4px 0 0 14px; background:var(--accent); color:#fff;
  font-size:9px; min-width:15px; height:15px; border-radius:99px; display:grid; place-items:center; padding:0 3px}

/* 半屏词卡 */
.sheet{position:absolute; left:0; right:0; bottom:0; z-index:50; background:var(--card);
  border-radius:20px 20px 0 0; box-shadow:0 -16px 44px -12px rgba(40,30,20,.4);
  transform:translateY(102%); transition:transform .26s cubic-bezier(.2,.8,.2,1); padding:10px 18px 22px}
.sheet.open{transform:none}
.grab{width:36px; height:4px; background:var(--line-2); border-radius:2px; margin:0 auto 12px}
.sheet .st{display:flex; gap:0; border-bottom:1px solid var(--line); margin-bottom:14px}
.sheet .st button{flex:1; height:38px; border:0; background:transparent; font-size:13px; color:var(--ink-3);
  border-bottom:2px solid transparent; cursor:pointer}
.sheet .st button.on{color:var(--ink); border-bottom-color:var(--accent); font-weight:600}
.sheet h3{margin:0; font-family:var(--serif); font-size:26px; font-weight:600}
.sheet .ph{font-size:12.5px; color:var(--ink-3); margin-left:8px}
.sheet .mn{font-size:14.5px; line-height:1.8; margin-top:10px}
.sheet .ex{font-family:var(--serif); font-size:13.5px; line-height:1.75; color:var(--ink-2);
  margin-top:12px; padding-left:11px; border-left:2px solid var(--line)}
.sheet .acts{display:flex; gap:10px; margin-top:16px}
.sheet .acts button{height:46px; flex:1; border-radius:12px; font-size:14px; cursor:pointer}
.b1{border:1px solid var(--line-2); background:transparent; color:var(--ink-2)}
.b2{border:0; background:var(--ink); color:var(--paper)}
.mask{position:absolute; inset:0; background:rgba(20,16,10,.25); z-index:45; opacity:0; pointer-events:none; transition:opacity .24s}
.mask.on{opacity:1; pointer-events:auto}

@media (max-width:700px){
  body{padding:0; display:block; background:var(--paper)}
  .stage{gap:0}
  .cap{display:none}
  .phone{width:100%; height:100dvh; border-radius:0; padding:0; background:var(--paper); box-shadow:none}
  .screen{border-radius:0; height:100dvh}
  .island{display:none}
  .statusbar{height:env(safe-area-inset-top,24px); min-height:24px}
}
</style>
</head>
<body>
<div class="stage">
  <figure class="phone" style="margin:0">
    <div class="screen">
      <div class="island"></div>
      <div class="statusbar">
        <span>9:41</span>
        <span class="icons">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9.5a12 12 0 0 1 16 0M7 13a8 8 0 0 1 10 0M10 16.5a4 4 0 0 1 4 0"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="7" width="17" height="10" rx="2.5"/><rect x="4" y="9" width="11" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
        </span>
      </div>

      <div class="appbar">
        <button><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
        <div class="ttl">The Quiet Rebellion of Doing Nothing</div>
        <button><svg viewBox="0 0 24 24"><path d="M6 4.5h12v15l-6-4-6 4z"/></svg></button>
      </div>

      <div class="segwrap">
        <div class="seg" id="seg">
          <button data-m="en" class="on">原文</button>
          <button data-m="both">对照</button>
          <button data-m="zh">译文</button>
        </div>
      </div>
      <div class="progress"><i id="bar"></i></div>
      <div class="feed" id="feed"></div>

      <nav class="tabbar">
        <a class="on"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 5.5h7v14H4zM13 5.5h7v14h-7z"/></svg></span>文章</a>
        <a><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 4.5h12v15l-6-4-6 4z"/></svg></span>生词</a>
        <a><span class="ic"><svg viewBox="0 0 24 24"><rect x="3.5" y="7" width="13" height="13" rx="2"/><path d="M8 4h9.5A2.5 2.5 0 0 1 20 6.5V16"/></svg><b class="badge">6</b></span>复习</a>
        <a><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.6-3.6 4-5.4 7-5.4s5.4 1.8 7 5.4"/></svg></span>我的</a>
      </nav>

      <div class="mask" id="mask"></div>
      <div class="sheet" id="sheet"></div>
    </div>
  </figure>
  <figcaption class="cap"><b>方案 4 · 原生 App</b> · 顶栏 + 分段 + 卡片流 + 底部 Tab</figcaption>
</div>

<script>
const PARAS = [
  {en:"Not long ago, waiting was an unavoidable part of ordinary life. We waited in lines, waited for buses, waited for friends who were late. These small interludes were treated as dead time — moments to be endured rather than savored.",
   zh:"不久以前，等待还是日常生活里绕不开的一部分。我们排队、等公交、等迟到的朋友。这些短暂的间歇曾被当作「死时间」——是拿来忍受、而非品味的时刻。",
   words:['interlude','idle']},
  {en:"We are told that this is progress, that an unoccupied mind is a wasted one. But a growing body of research suggests the opposite: the idle brain does some of its most important work precisely when nothing is happening.",
   zh:"有人告诉我们这是进步，说闲着的大脑就是浪费的大脑。但越来越多的研究指向相反的结论：恰恰在无事发生的时候，无所事事的大脑在做一些最重要的工作。",
   words:['idle']},
  {en:"The cost of constant stimulation is easy to describe and hard to measure. Attention, like a muscle, can atrophy. Each fleeting hit of novelty delivers a small dose of gratification.",
   zh:"持续刺激的代价，说起来容易，衡量起来很难。注意力像肌肉一样，是会萎缩的。每一次转瞬即逝的新鲜感都送来一小剂满足。",
   words:['atrophy','fleeting']},
  {en:"None of this is an argument for smashing your phone. The device is not the villain; the habit is.",
   zh:"这一切并不是要你砸掉手机。设备不是罪魁祸首，习惯才是。",
   words:['villain']}
];
const WORDS = {
  interlude:{ph:'/ˈɪntərluːd/', pos:'n.', lv:'考研', zh:'（两件事之间的）间歇；插曲',
    ex:'These small interludes were treated as dead time.', exzh:'这些短暂的间歇曾被当作「死时间」。'},
  idle:{ph:'/ˈaɪdl/', pos:'adj.', lv:'CET-6', zh:'空闲的；无所事事的',
    ex:'the idle brain does its most important work', exzh:'无所事事的大脑在做最重要的工作'},
  atrophy:{ph:'/ˈætrəfi/', pos:'v.', lv:'GRE', zh:'（能力、肌肉）萎缩，衰退',
    ex:'Attention, like a muscle, can atrophy.', exzh:'注意力像肌肉一样，是会萎缩的。'},
  fleeting:{ph:'/ˈfliːtɪŋ/', pos:'adj.', lv:'雅思', zh:'转瞬即逝的',
    ex:'Each fleeting hit of novelty', exzh:'每一次转瞬即逝的新鲜感'},
  villain:{ph:'/ˈvɪlən/', pos:'n.', lv:'考研', zh:'反派；罪魁祸首',
    ex:'The device is not the villain; the habit is.', exzh:'设备不是罪魁祸首，习惯才是。'}
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl = t => {
  let s = esc(t);
  Object.keys(WORDS).forEach(k => { s = s.replace(new RegExp('\\b'+k+'(?:s|es|ed|d|ing)?\\b','gi'), m => `<span class="w" data-k="${k}">${m}</span>`); });
  return s;
};

const feed = document.getElementById('feed');
feed.innerHTML = PARAS.map((p, i) => `
  <article class="card" data-i="${i}">
    <span class="no">${String(i+1).padStart(2,'0')}</span>
    <div class="en">${hl(p.en)}</div>
    <div class="zh">${esc(p.zh)}</div>
    <div class="foot">
      <button class="chip tr" data-tr="${i}">译</button>
      ${p.words.map(k => `<button class="chip" data-w="${k}">${k}</button>`).join('')}
    </div>
  </article>`).join('');

/* 分段：原文 / 对照 / 译文 */
const cards = [...feed.querySelectorAll('.card')];
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
  const m = b.dataset.m;
  cards.forEach(c => {
    c.querySelector('.en').style.display = m === 'zh' ? 'none' : '';
    c.querySelector('.zh').style.display = m === 'en' ? 'none' : '';
    c.classList.toggle('open', m !== 'en');
    c.querySelector('.tr').classList.toggle('on', m !== 'en');
  });
});

/* 单卡译文 */
feed.addEventListener('click', e => {
  const t = e.target.closest('.tr');
  if (t) { const c = t.closest('.card'); const on = c.classList.toggle('open'); t.classList.toggle('on', on); t.textContent = on ? '收起' : '译'; return; }
  const chip = e.target.closest('.chip[data-w]');
  if (chip) { openSheet(chip.dataset.w); return; }
  const w = e.target.closest('.w');
  if (w) openSheet(w.dataset.k);
});

/* 半屏词卡 */
const sheet = document.getElementById('sheet'), mask = document.getElementById('mask');
const close = () => { sheet.classList.remove('open'); mask.classList.remove('on'); };
mask.onclick = close;
function openSheet(k){
  const d = WORDS[k]; if (!d) return;
  sheet.innerHTML = `
    <div class="grab"></div>
    <div class="st"><button class="on">释义</button><button>例句</button><button>搭配</button></div>
    <h3>${esc(k)}<span class="ph">${esc(d.ph)}</span></h3>
    <div class="mn">${esc(d.zh)}</div>
    <div class="ex">${esc(d.ex)}<br><span style="color:#8a8172">${esc(d.exzh)}</span></div>
    <div class="acts"><button class="b1">朗读</button><button class="b2">加入生词本</button></div>`;
  sheet.classList.add('open'); mask.classList.add('on');
  sheet.querySelector('.b1').onclick = () => {
    if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(k); u.lang='en-US'; speechSynthesis.speak(u); }
  };
  sheet.querySelector('.b2').onclick = () => { close(); };
}

/* 进度 */
const bar = document.getElementById('bar');
feed.addEventListener('scroll', () => {
  const h = feed.scrollHeight - feed.clientHeight;
  bar.style.width = (h > 0 ? (feed.scrollTop / h) * 100 : 0) + '%';
}, { passive: true });
</script>
</body>
</html>
